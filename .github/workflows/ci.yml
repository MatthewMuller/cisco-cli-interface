name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev
        
    - name: Build application
      run: |
        make clean
        make
        
    - name: Run tests
      run: |
        ./tests/integration/test_compile.sh
        
    - name: Check build artifacts
      run: |
        ls -la build/
        file build/cisco-cli-interface
        
